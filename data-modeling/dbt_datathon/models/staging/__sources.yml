version: 2

sources:
  - name: ecom
    schema: "{{ target.schema }}_raw"
    description: E-commerce data for the Jaffle Shop
    tables:
      - name: raw_customers
        description: One record per person who has purchased one or more items
      - name: raw_orders
        description: One record per order (consisting of one or more order items)
        config:
          loaded_at_field: ordered_at
      - name: raw_items
        description: Items included in an order
      - name: raw_stores
        config:
          loaded_at_field: opened_at
      - name: raw_products
        description: One record per SKU for items sold in stores
      - name: raw_supplies
        description: One record per supply per SKU of items sold in stores

  - name: datathon_factored
    schema: datathon_factored
    description: LATAM Bank PostgreSQL tables aligned with the Pydantic data contracts.
    tables:
      - name: customers
        description: Bank customer dimension table
        config:
          loaded_at_field: last_updated
      - name: products
        description: Active financial products of customers
        config:
          loaded_at_field: last_updated
      - name: branches
        description: Physical bank branches
      - name: service_agents
        description: Customer service agents
      - name: marketing_campaigns
        description: Bank marketing campaigns
      - name: transactions
        description: Daily financial transactions
        config:
          loaded_at_field: process_date
      - name: call_center_interactions
        description: Call center interactions with customers
        config:
          loaded_at_field: process_date
      - name: call_transcripts
        description: Call center call transcripts
        config:
          loaded_at_field: process_date
      - name: satisfaction_surveys
        description: Post-interaction satisfaction surveys (CSAT, NPS)
        config:
          loaded_at_field: process_date
      - name: digital_events
        description: Digital channel interaction events (mobile app, web)
        config:
          loaded_at_field: process_date
      - name: complaints
        description: Complaints and claims system (PQR)
        config:
          loaded_at_field: process_date
      - name: campaign_sends
        description: Individual marketing campaign sends
        config:
          loaded_at_field: process_date
