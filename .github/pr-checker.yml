name: PR Checker
on:
  pull_request:
    branches:
      - '*'

jobs:
  check-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure Datahub API Credentials
        env:
          DATAHUB_API_URL: ${{ vars.DATAHUB_API_URL }}
          DATAHUB_API_KEY: ${{ secrets.DATAHUB_API_KEY }}
        run: |
          echo "DATAHUB_API_URL=${DATAHUB_API_URL}" >> "$GITHUB_ENV"
          echo "DATAHUB_API_KEY=${DATAHUB_API_KEY}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install api_service
        working-directory: api_service
        run: python -m pip install -e .

      - name: Verify data contract
        working-directory: api_service
        run: python -m factored_api.utils.data_contract
