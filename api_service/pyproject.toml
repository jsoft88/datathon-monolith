[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factored-api"
version = "0.1.0"
description = "Factored datathon API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.9.0",
    "python-dateutil>=2.9.0",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
factored-api = "factored_api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["factored_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
